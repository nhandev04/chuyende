<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Primary Meta Tags -->
        <title>HealthLens AI - Smart AI Nutrition & Calorie Tracking Platform</title>
        <meta name="title" content="HealthLens AI - Smart AI Nutrition & Calorie Tracking Platform" />
        <meta
            name="description"
            content="AI-driven platform for automated food computer vision, biometric TDEE calorie tracking, and personalized RAG meal recommendations."
        />
        <meta
            name="keywords"
            content="AI nutrition, calorie tracker, food computer vision, RAG meal planner, TDEE calculator, health lens, diet recommendation, macro tracking"
        />
        <meta name="author" content="HealthLens AI Team" />
        <meta name="application-name" content="HealthLens AI" />
        <meta name="robots" content="index, follow" />

        <!-- Favicon & Icons -->
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/favicon.svg" />

        <!-- Theme & Color -->
        <meta name="theme-color" content="#10b981" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="HealthLens AI" />
        <meta property="og:title" content="HealthLens AI - Smart AI Nutrition & Calorie Tracking Platform" />
        <meta
            property="og:description"
            content="Scan your meal with AI computer vision, track daily calories, and get personalized RAG meal plans tailored to your biometrics."
        />
        <meta property="og:image" content="/favicon.svg" />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:title" content="HealthLens AI - Smart AI Nutrition & Calorie Tracking" />
        <meta
            property="twitter:description"
            content="AI food computer vision, biometric calorie tracking & RAG meal planning."
        />
        <meta property="twitter:image" content="/favicon.svg" />

        <!-- Font Preconnect -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    </head>
    <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
